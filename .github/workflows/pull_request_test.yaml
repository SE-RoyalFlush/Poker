name: Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/pull_request_test.yaml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/pull_request_test.yaml'

jobs:
  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Go installation
        run: go version

      - name: Install dependencies
        working-directory: ./backend
        run: |
          go mod download
          go mod verify

      - name: Clean test cache
        working-directory: ./backend
        run: go clean -testcache

      - name: Run tests
        working-directory: ./backend
        run: go test -v -race -cover ./pkg/...

      - name: Test summary
        if: always()
        working-directory: ./backend
        run: |
          echo "✅ Backend tests completed"
          go test -cover ./pkg/... | grep -E "coverage|PASS|FAIL"

  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node installation
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Chrome (for testing)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Run linter (if available)
        working-directory: ./frontend
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --coverage --watch=false --browsers=ChromeHeadless

      - name: Test summary
        if: always()
        working-directory: ./frontend
        run: |
          echo "✅ Frontend tests completed"
