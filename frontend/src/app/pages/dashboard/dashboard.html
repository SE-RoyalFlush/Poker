<div class="rf-dash">

  <!-- ── NAV ── -->
  <nav class="rf-nav" role="navigation" aria-label="App navigation">
    <a class="rf-nav__logo" routerLink="/dashboard" aria-label="Royal Flush dashboard">
      <span class="rf-nav__logo-badge" aria-hidden="true">RF</span>
      <span class="rf-nav__logo-text">Royal Flush</span>
    </a>

    <div class="rf-nav__user" *ngIf="currentUser">
      <span class="rf-nav__username" aria-label="Logged in as {{ currentUser.username }}">
        {{ currentUser.username }}
      </span>
      <div class="rf-nav__avatar" aria-hidden="true">
        {{ currentUser.username[0].toUpperCase() }}
      </div>
      <button mat-stroked-button class="rf-nav__logout"
              (click)="onLogout()" aria-label="Log out">
        Log Out
      </button>
    </div>
  </nav>

  <!-- ── MAIN ── -->
  <main class="rf-dash__main" role="main">

    <!-- Page header -->
    <header class="rf-dash__header">
      <h1 class="rf-dash__greeting">
        Good game,
        <span class="rf-dash__greeting--accent">{{ currentUser?.username ?? 'Player' }}</span>.
      </h1>
      <p class="rf-dash__sub">Create a private room or jump into an existing one.</p>
    </header>

    <!-- ── TWO CARDS ── -->
    <div class="rf-dash__cards">
      <app-create-room></app-create-room>
      <app-join-room></app-join-room>
    </div>

  </main>

  <!-- ── FOOTER ── -->
  <footer class="rf-footer" role="contentinfo">
    <span class="rf-footer__copy">© 2025 Royal Flush · Play responsibly · 18+</span>
    <span class="rf-footer__suits" aria-hidden="true">♥ ♠ ♦ ♣</span>
  </footer>

</div>
