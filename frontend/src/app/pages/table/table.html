<div class="rf-table">
  <nav class="rf-nav">
    <span class="rf-nav__logo">
      <span class="rf-nav__badge">RF</span>
      Royal Flush
    </span>
    <div class="rf-nav__user">
      <span class="rf-nav__avatar">{{ currentUsername.charAt(0).toUpperCase() }}</span>
      <span class="rf-nav__username">{{ currentUsername }}</span>
    </div>
  </nav>

  <main class="rf-table__arena" data-cy="table-arena">
    <div class="rf-table__felt">

      <!-- Community cards -->
      <div class="rf-table__community">
        <div
          *ngFor="let slot of communityCardSlots; let i = index"
          class="rf-table__community-slot"
          data-cy="community-slot"
        >
          <app-card
            *ngIf="slot; else emptySlot"
            [rank]="slot.rank"
            [suit]="slot.suit"
            [faceDown]="false"
          ></app-card>
          <ng-template #emptySlot>
            <div class="rf-table__card-slot"></div>
          </ng-template>
        </div>
      </div>

      <!-- Pot & phase info -->
      <div class="rf-table__info">
        <span class="rf-table__pot" data-cy="pot-display">Pot: ${{ gameState?.pot ?? 0 }}</span>
        <span class="rf-table__phase-badge" data-cy="phase-badge">{{ (gameState?.phase ?? 'waiting') | uppercase }}</span>
      </div>

      <!-- Opponent seats -->
      <div
        *ngFor="let seat of opponentSeats"
        class="rf-seat"
        [attr.data-seat]="seat.seatIndex"
        data-cy="opponent-seat"
      >
        <div class="rf-seat__cards">
          <app-card [faceDown]="true"></app-card>
          <app-card [faceDown]="true"></app-card>
        </div>
        <div class="rf-seat__info">
          <span class="rf-seat__username" data-cy="seat-username">{{ seat.username }}</span>
          <span class="rf-seat__chips" data-cy="seat-chips">${{ seat.chipCount }}</span>
        </div>
      </div>

    </div><!-- .rf-table__felt -->

    <!-- Current user's zone -->
    <div class="rf-table__player-zone" data-cy="player-zone">
      <div class="rf-table__hole-cards">
        <ng-container *ngFor="let slot of holeCardSlots">
          <app-card
            *ngIf="slot; else emptyHole"
            [rank]="slot.rank"
            [suit]="slot.suit"
            [faceDown]="false"
          ></app-card>
          <ng-template #emptyHole>
            <div class="rf-table__card-slot" data-cy="hole-card-slot-empty"></div>
          </ng-template>
        </ng-container>
      </div>
      <div class="rf-table__player-info">
        <span class="rf-table__player-name">{{ currentUserSeat?.username ?? currentUsername }}</span>
        <span class="rf-table__player-chips" *ngIf="currentUserSeat">${{ currentUserSeat.chipCount }}</span>
      </div>

      <app-game-controls
        [isActivePlayer]="isActivePlayer"
        [callAmount]="callAmount"
        [maxRaise]="maxRaise"
        (action)="onGameAction($event)"
        data-cy="game-controls"
      ></app-game-controls>
    </div>

  </main>
</div>
