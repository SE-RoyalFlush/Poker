openapi: 3.0.3
info:
  title: Poker Backend API
  version: 0.2.0
  description: >
    OpenAPI spec for the Poker backend (Go + Gorilla Mux).
    Currently includes health check with database status and standardized JSON error format.

servers:
  - url: http://localhost:8080/api
    description: Local server

tags:
  - name: System
    description: System/health endpoints
  - name: Authentication
    description: User registration and login

paths:
  /me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      description: >
        Returns the currently authenticated user. Requires valid credentials (Basic Auth for demo; session/cookie in production).
      operationId: getCurrentUser
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized (not logged in or invalid credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
                message: Missing or invalid credentials
                status: 401
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Internal Server Error
                message: Database not initialized
                status: 500
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns server liveness status and database connection status.
      operationId: getHealth
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                connected:
                  summary: Database connected
                  value:
                    status: alive
                    database: connected
                disconnected:
                  summary: Database disconnected
                  value:
                    status: alive
                    database: disconnected

  /register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: Accepts a username and password, hashes the password, and creates a new user in the database.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad Request (validation failed or invalid JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                shortUsername:
                  summary: Username too short
                  value:
                    error: Bad Request
                    message: Username must be at least 3 characters
                    status: 400
                shortPassword:
                  summary: Password too short
                  value:
                    error: Bad Request
                    message: Password must be at least 6 characters
                    status: 400
        "409":
          description: Conflict (username already exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Conflict
                message: Username already exists
                status: 409
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Internal Server Error
                message: Database error
                status: 500

  # Note: OpenAPI can't truly describe "any unmatched route" behavior in `paths`,
  # so we document the 404 response format and provide an example route.
  /random:
    get:
      tags: [System]
      summary: Example of standardized 404 response
      description: >
        This route is not implemented; it exists in this spec only to show the
        structured JSON 404 error returned by the API for unknown routes.
      operationId: getRandomExample404
      responses:
        "404":
          description: Not Found (standard error format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Not Found
                message: The requested resource was not found
                status: 404

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          description: Server liveness indicator
          enum: [alive]
        database:
          type: string
          description: Database connection status
          enum: [connected, disconnected]

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          example: testuser
        password:
          type: string
          minLength: 6
          example: password123

    User:
      type: object
      properties:
        ID:
          type: integer
          example: 1
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        DeletedAt:
          type: string
          format: date-time
          nullable: true
        username:
          type: string
          example: testuser
      required: [ID, username]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message, status]
      properties:
        error:
          type: string
          description: High-level error type/category
          example: Not Found
        message:
          type: string
          description: Human-readable error message
          example: The requested resource was not found
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 404

  responses:
    NotFound:
      description: Standard 404 response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Not Found
            message: The requested resource was not found
            status: 404